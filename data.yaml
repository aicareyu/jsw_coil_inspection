# YOLO11 training configuration for coil defect inspection.
# Populate dataset/images and dataset/labels, then train:
#
#   python -m scripts.train_yolo
#
# or:
#   yolo detect train data=data.yaml model=yolo11n.pt epochs=100 imgsz=640

path: dataset
train: images/train
val: images/val

names:
  0: foreign_edge
  1: edge_rub
  2: loose_coil

nc: 3
